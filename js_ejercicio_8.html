<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Words Counter</title>
    <script src="words-counter.js" defer></script>
</head>
<body>

    <h1>Words and Characters Counter</h1>
    <label for="text-input">Write a paragraph:</label>

    <textarea id="text-input" rows="8" cols="50" maxlength="500" placeholder="Write anything..."></textarea>

    <p id="characters-count">Characters: 0</p>
    <p id="words-count">Words: 0</p>

</body>
